<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 380" width="100%" height="100%" style="background:#0A0E23; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="blueCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E90FF"/>
      <stop offset="100%" stop-color="#00C6FF"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00C6FF" flood-opacity="0.18"/>
    </filter>
    <filter id="godGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#F59E0B" flood-opacity="0.25"/>
    </filter>
    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#00C6FF"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <text x="660" y="38" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700" letter-spacing="1">PLANBOT TIER PROGRESSION &amp; ANALYTICS ROADMAP</text>

  <!-- ==================== TIER 1: FREE ==================== -->
  <g transform="translate(40, 60)">
    <!-- Card Box -->
    <rect x="0" y="0" width="240" height="280" rx="16" fill="#121838" stroke="#334155" stroke-width="1.5" />
    
    <!-- Header -->
    <rect x="0" y="0" width="240" height="60" rx="16" fill="rgba(255,255,255,0.03)" />
    <text x="120" y="36" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700">🆓 Free Tier</text>
    <text x="120" y="52" text-anchor="middle" fill="#94A3B8" font-size="11">₹0 Forever</text>

    <line x1="20" y1="62" x2="220" y2="62" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- Bullets -->
    <circle cx="28" cy="95" r="3" fill="#64748B"/>
    <text x="40" y="99" fill="#E2E8F0" font-size="13" font-weight="500">3 plans history</text>

    <circle cx="28" cy="130" r="3" fill="#64748B"/>
    <text x="40" y="134" fill="#E2E8F0" font-size="13" font-weight="500">Today's focus time</text>

    <circle cx="28" cy="165" r="3" fill="#64748B"/>
    <text x="40" y="169" fill="#E2E8F0" font-size="13" font-weight="500">Basic ring (Overall %)</text>
    <text x="40" y="186" fill="#94A3B8" font-size="11">+ Level &amp; XP tracking</text>

    <circle cx="28" cy="220" r="3" fill="#EF4444"/>
    <text x="40" y="224" fill="#94A3B8" font-size="13">🔒 Locked graphs</text>
  </g>

  <!-- Connector 1 -->
  <g transform="translate(280, 200)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#00C6FF" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#arrow)"/>
    <rect x="8" y="-24" width="44" height="18" rx="9" fill="#1E293B" stroke="#00C6FF" stroke-width="1"/>
    <text x="30" y="-12" text-anchor="middle" fill="#38BDF8" font-size="9" font-weight="700">₹99</text>
  </g>

  <!-- ==================== TIER 2: PRO ==================== -->
  <g transform="translate(340, 60)" filter="url(#glow)">
    <!-- Card Box -->
    <rect x="0" y="0" width="250" height="280" rx="16" fill="#141E47" stroke="#1E90FF" stroke-width="1.5" />
    
    <!-- Header -->
    <rect x="0" y="0" width="250" height="60" rx="16" fill="rgba(30,144,255,0.12)" />
    <text x="125" y="36" text-anchor="middle" fill="#38BDF8" font-size="17" font-weight="700">💎 Pro Tier (₹99)</text>
    <text x="125" y="52" text-anchor="middle" fill="#93C5FD" font-size="11">For Serious Planners</text>

    <line x1="20" y1="62" x2="230" y2="62" stroke="#1E90FF" stroke-width="1" stroke-opacity="0.4"/>

    <!-- Bullets -->
    <circle cx="28" cy="95" r="3" fill="#38BDF8"/>
    <text x="40" y="99" fill="#FFFFFF" font-size="13" font-weight="600">15 plans history</text>

    <circle cx="28" cy="130" r="3" fill="#38BDF8"/>
    <text x="40" y="134" fill="#FFFFFF" font-size="13">Week focus time</text>

    <circle cx="28" cy="165" r="3" fill="#38BDF8"/>
    <text x="40" y="169" fill="#FFFFFF" font-size="13">Trend arrow ↑↓ (WoW)</text>

    <circle cx="28" cy="200" r="3" fill="#38BDF8"/>
    <text x="40" y="204" fill="#FFFFFF" font-size="13">1 Active Goal</text>

    <circle cx="28" cy="235" r="3" fill="#38BDF8"/>
    <text x="40" y="239" fill="#38BDF8" font-size="13" font-weight="600">🔓 Unlocked 7-Day Trend</text>
  </g>

  <!-- Connector 2 -->
  <g transform="translate(590, 200)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#00C6FF" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#arrow)"/>
    <rect x="8" y="-24" width="44" height="18" rx="9" fill="#1E293B" stroke="#00C6FF" stroke-width="1"/>
    <text x="30" y="-12" text-anchor="middle" fill="#38BDF8" font-size="9" font-weight="700">₹129</text>
  </g>

  <!-- ==================== TIER 3: ELITE ==================== -->
  <g transform="translate(650, 48)" filter="url(#glow)">
    <!-- Top Popular Badge -->
    <rect x="65" y="-12" width="130" height="24" rx="12" fill="url(#blueCyanGrad)" />
    <text x="130" y="4" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="800" letter-spacing="0.5">MOST POPULAR</text>

    <!-- Card Box -->
    <rect x="0" y="0" width="260" height="304" rx="16" fill="#162256" stroke="#00C6FF" stroke-width="2" />
    
    <!-- Header -->
    <rect x="0" y="0" width="260" height="60" rx="16" fill="rgba(0,198,255,0.15)" />
    <text x="130" y="36" text-anchor="middle" fill="#00C6FF" font-size="17" font-weight="700">⚡ Elite Tier (₹129)</text>
    <text x="130" y="52" text-anchor="middle" fill="#A5F3FC" font-size="11">Smart Productivity Hub</text>

    <line x1="20" y1="62" x2="240" y2="62" stroke="#00C6FF" stroke-width="1" stroke-opacity="0.4"/>

    <!-- Bullets -->
    <circle cx="28" cy="90" r="3" fill="#00C6FF"/>
    <text x="40" y="94" fill="#FFFFFF" font-size="13" font-weight="600">30 plans history</text>

    <circle cx="28" cy="120" r="3" fill="#00C6FF"/>
    <text x="40" y="124" fill="#FFFFFF" font-size="13">Month focus time</text>

    <circle cx="28" cy="150" r="3" fill="#00C6FF"/>
    <text x="40" y="154" fill="#FFFFFF" font-size="13">30-Day Rolling Stats</text>

    <circle cx="28" cy="180" r="3" fill="#00C6FF"/>
    <text x="40" y="184" fill="#FFFFFF" font-size="13">3 Active Goals</text>

    <circle cx="28" cy="210" r="3" fill="#00C6FF"/>
    <text x="40" y="214" fill="#FFFFFF" font-size="13">Subject Breakdown</text>

    <circle cx="28" cy="240" r="3" fill="#00C6FF"/>
    <text x="40" y="244" fill="#38BDF8" font-size="13" font-weight="600">Productivity Score v2</text>

    <circle cx="28" cy="270" r="3" fill="#00C6FF"/>
    <text x="40" y="274" fill="#00C6FF" font-size="13" font-weight="600">🔓 Unlocked Heatmap</text>
  </g>

  <!-- Connector 3 -->
  <g transform="translate(910, 200)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#arrow)"/>
    <rect x="8" y="-24" width="44" height="18" rx="9" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
    <text x="30" y="-12" text-anchor="middle" fill="#FCD34D" font-size="9" font-weight="700">₹249</text>
  </g>

  <!-- ==================== TIER 4: GOD ==================== -->
  <g transform="translate(970, 48)" filter="url(#godGlow)">
    <!-- Top Badge -->
    <rect x="70" y="-12" width="150" height="24" rx="12" fill="url(#goldGrad)" />
    <text x="145" y="4" text-anchor="middle" fill="#78350F" font-size="10" font-weight="800" letter-spacing="0.5">MOST POWERFUL</text>

    <!-- Card Box -->
    <rect x="0" y="0" width="290" height="304" rx="16" fill="#1E1738" stroke="#F59E0B" stroke-width="2" />
    
    <!-- Header -->
    <rect x="0" y="0" width="290" height="60" rx="16" fill="rgba(245,158,11,0.15)" />
    <text x="145" y="36" text-anchor="middle" fill="#FCD34D" font-size="17" font-weight="700">👑 God Tier (₹249)</text>
    <text x="145" y="52" text-anchor="middle" fill="#FEF08A" font-size="11">Ultimate AI &amp; Analytics Power</text>

    <line x1="20" y1="62" x2="270" y2="62" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.4"/>

    <!-- Bullets -->
    <circle cx="28" cy="90" r="3" fill="#F59E0B"/>
    <text x="40" y="94" fill="#FFFFFF" font-size="13" font-weight="600">100 plans (All-Time)</text>

    <circle cx="28" cy="120" r="3" fill="#F59E0B"/>
    <text x="40" y="124" fill="#FFFFFF" font-size="13">Peak Study Time (Diurnal)</text>

    <circle cx="28" cy="150" r="3" fill="#F59E0B"/>
    <text x="40" y="154" fill="#FFFFFF" font-size="13">Peer Benchmark (Top X%)</text>

    <circle cx="28" cy="180" r="3" fill="#F59E0B"/>
    <text x="40" y="184" fill="#FCD34D" font-size="13" font-weight="600">✨ Unlimited Active Goals</text>

    <circle cx="28" cy="210" r="3" fill="#F59E0B"/>
    <text x="40" y="214" fill="#FCD34D" font-size="13" font-weight="600">🧠 Study Pattern AI</text>

    <circle cx="28" cy="240" r="3" fill="#F59E0B"/>
    <text x="40" y="244" fill="#FFFFFF" font-size="13">📊 AI Weekly Insights</text>

    <circle cx="28" cy="270" r="3" fill="#F59E0B"/>
    <text x="40" y="274" fill="#FFFFFF" font-size="13">📥 CSV Data Export</text>
  </g>
</svg>
