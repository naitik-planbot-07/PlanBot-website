<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1140" width="100%" height="100%" style="background:#0A0E23; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E90FF"/>
      <stop offset="100%" stop-color="#00C6FF"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <filter id="glowV" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00C6FF" flood-opacity="0.2"/>
    </filter>
    <filter id="goldGlowV" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#F59E0B" flood-opacity="0.25"/>
    </filter>
    <marker id="arrowV" viewBox="0 0 10 10" refX="5" refY="6" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 0 L 5 8 L 9 0 z" fill="#00C6FF"/>
    </marker>
    <marker id="arrowGoldV" viewBox="0 0 10 10" refX="5" refY="6" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 0 L 5 8 L 9 0 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="260" y="40" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700" letter-spacing="1">PLANBOT UPGRADE ROADMAP</text>

  <!-- ==================== TIER 1: FREE ==================== -->
  <g transform="translate(60, 65)">
    <rect x="0" y="0" width="400" height="150" rx="16" fill="#121838" stroke="#334155" stroke-width="1.5" />
    <rect x="0" y="0" width="400" height="42" rx="16" fill="rgba(255,255,255,0.03)" />
    <text x="200" y="27" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">🆓 Free Tier</text>

    <!-- Bullets -->
    <circle cx="36" cy="62" r="3" fill="#64748B"/>
    <text x="50" y="66" fill="#E2E8F0" font-size="13">3 plans history</text>

    <circle cx="36" cy="86" r="3" fill="#64748B"/>
    <text x="50" y="90" fill="#E2E8F0" font-size="13">Today's focus time</text>

    <circle cx="36" cy="110" r="3" fill="#64748B"/>
    <text x="50" y="114" fill="#E2E8F0" font-size="13">Overall % + Level/XP</text>

    <circle cx="36" cy="134" r="3" fill="#EF4444"/>
    <text x="50" y="138" fill="#94A3B8" font-size="13">🔒 Locked graphs</text>
  </g>

  <!-- Connector 1 -->
  <g transform="translate(260, 215)">
    <line x1="0" y1="0" x2="0" y2="85" stroke="#00C6FF" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#arrowV)"/>
    <rect x="-65" y="24" width="130" height="32" rx="16" fill="#1E293B" stroke="#00C6FF" stroke-width="1.5"/>
    <text x="0" y="45" text-anchor="middle" fill="#38BDF8" font-size="13" font-weight="700">Upgrade ₹99</text>
  </g>

  <!-- ==================== TIER 2: PRO ==================== -->
  <g transform="translate(60, 310)" filter="url(#glowV)">
    <rect x="0" y="0" width="400" height="180" rx="16" fill="#141E47" stroke="#1E90FF" stroke-width="1.5" />
    <rect x="0" y="0" width="400" height="42" rx="16" fill="rgba(30,144,255,0.12)" />
    <text x="200" y="27" text-anchor="middle" fill="#38BDF8" font-size="16" font-weight="700">💎 Pro Tier</text>

    <!-- Bullets -->
    <circle cx="36" cy="62" r="3" fill="#38BDF8"/>
    <text x="50" y="66" fill="#FFFFFF" font-size="13" font-weight="600">15 plans history</text>

    <circle cx="36" cy="86" r="3" fill="#38BDF8"/>
    <text x="50" y="90" fill="#FFFFFF" font-size="13">Week focus time</text>

    <circle cx="36" cy="110" r="3" fill="#38BDF8"/>
    <text x="50" y="114" fill="#FFFFFF" font-size="13">Week-over-week trend ↑↓</text>

    <circle cx="36" cy="134" r="3" fill="#38BDF8"/>
    <text x="50" y="138" fill="#FFFFFF" font-size="13">1 Active Goal</text>

    <circle cx="36" cy="158" r="3" fill="#38BDF8"/>
    <text x="50" y="162" fill="#38BDF8" font-size="13" font-weight="600">🔓 Unlocked 7-Day Trend</text>
  </g>

  <!-- Connector 2 -->
  <g transform="translate(260, 490)">
    <line x1="0" y1="0" x2="0" y2="85" stroke="#00C6FF" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#arrowV)"/>
    <rect x="-65" y="24" width="130" height="32" rx="16" fill="#1E293B" stroke="#00C6FF" stroke-width="1.5"/>
    <text x="0" y="45" text-anchor="middle" fill="#00C6FF" font-size="13" font-weight="700">Upgrade ₹129</text>
  </g>

  <!-- ==================== TIER 3: ELITE ==================== -->
  <g transform="translate(60, 585)" filter="url(#glowV)">
    <rect x="0" y="0" width="400" height="230" rx="16" fill="#162256" stroke="#00C6FF" stroke-width="2" />
    <rect x="0" y="0" width="400" height="42" rx="16" fill="rgba(0,198,255,0.15)" />
    <text x="200" y="27" text-anchor="middle" fill="#00C6FF" font-size="16" font-weight="700">⚡ Elite Tier</text>

    <!-- Bullets -->
    <circle cx="36" cy="62" r="3" fill="#00C6FF"/>
    <text x="50" y="66" fill="#FFFFFF" font-size="13" font-weight="600">30 plans history</text>

    <circle cx="36" cy="86" r="3" fill="#00C6FF"/>
    <text x="50" y="90" fill="#FFFFFF" font-size="13">Month focus time</text>

    <circle cx="36" cy="110" r="3" fill="#00C6FF"/>
    <text x="50" y="114" fill="#FFFFFF" font-size="13">30-Day Rolling Stats</text>

    <circle cx="36" cy="134" r="3" fill="#00C6FF"/>
    <text x="50" y="138" fill="#FFFFFF" font-size="13">3 Active Goals</text>

    <circle cx="36" cy="158" r="3" fill="#00C6FF"/>
    <text x="50" y="162" fill="#FFFFFF" font-size="13">Subject Breakdown</text>

    <circle cx="36" cy="182" r="3" fill="#00C6FF"/>
    <text x="50" y="186" fill="#38BDF8" font-size="13" font-weight="600">Productivity Score v2</text>

    <circle cx="36" cy="206" r="3" fill="#00C6FF"/>
    <text x="50" y="210" fill="#00C6FF" font-size="13" font-weight="600">🔓 Unlocked Heatmap</text>
  </g>

  <!-- Connector 3 -->
  <g transform="translate(260, 815)">
    <line x1="0" y1="0" x2="0" y2="85" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#arrowGoldV)"/>
    <rect x="-65" y="24" width="130" height="32" rx="16" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="0" y="45" text-anchor="middle" fill="#FCD34D" font-size="13" font-weight="700">Upgrade ₹249</text>
  </g>

  <!-- ==================== TIER 4: GOD ==================== -->
  <g transform="translate(60, 910)" filter="url(#goldGlowV)">
    <rect x="0" y="0" width="400" height="225" rx="16" fill="#1E1738" stroke="#F59E0B" stroke-width="2" />
    <rect x="0" y="0" width="400" height="42" rx="16" fill="rgba(245,158,11,0.15)" />
    <text x="200" y="27" text-anchor="middle" fill="#FCD34D" font-size="16" font-weight="700">👑 God Tier</text>

    <!-- Bullets -->
    <circle cx="36" cy="60" r="3" fill="#F59E0B"/>
    <text x="50" y="64" fill="#FFFFFF" font-size="13" font-weight="600">100 plans (All-Time)</text>

    <circle cx="36" cy="84" r="3" fill="#F59E0B"/>
    <text x="50" y="88" fill="#FFFFFF" font-size="13">Time-of-Day Distribution</text>

    <circle cx="36" cy="108" r="3" fill="#F59E0B"/>
    <text x="50" y="112" fill="#FFFFFF" font-size="13">Peer Benchmark (Top X%)</text>

    <circle cx="36" cy="132" r="3" fill="#F59E0B"/>
    <text x="50" y="136" fill="#FCD34D" font-size="13" font-weight="600">✨ Unlimited Goals</text>

    <circle cx="36" cy="156" r="3" fill="#F59E0B"/>
    <text x="50" y="160" fill="#FCD34D" font-size="13" font-weight="600">🧠 Study Pattern AI</text>

    <circle cx="36" cy="180" r="3" fill="#F59E0B"/>
    <text x="50" y="184" fill="#FFFFFF" font-size="13">📊 AI Weekly Insights</text>

    <circle cx="36" cy="204" r="3" fill="#F59E0B"/>
    <text x="50" y="208" fill="#FFFFFF" font-size="13">📥 CSV Data Export</text>
  </g>
</svg>
